server:
  port: 8080

spring:
  application:
    name: akilli-kutuphane-v4
logging:
  level:
    org.springframework.security: TRACE

  # ── Veritabani ────────────────────────────────────────────────
  # PostgreSQL (Docker Compose ortaminda PG_HOST=postgres ile override edilir)
  # H2 (local development — PostgreSQL yoksa otomatik fallback)
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/akilli_kutup;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Redis ─────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ── Statik dosya servisi (frontend) ───────────────────────────
  web:
    resources:
      static-locations: classpath:/static/,file:./frontend/,file:/app/frontend/

# ── JWT ─────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:akilli-kutuphane-v4-jwt-secret-key-change-in-production}
    expiration-ms: 3600000
  legacy:
    api-server:
      enabled: false
    sqlite:
      path: data/database.db
