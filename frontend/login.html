<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Akıllı Kütüphane</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-left">
                <div class="login-illustration">
                    <i class="fas fa-book-reader"></i>
                </div>
                <h2>Geleceğin Kütüphanesi</h2>
                <p>Bilgiye güvenle ve hızla erişin.</p>
            </div>
            <div class="login-right">
                <div class="login-header">
                    <div class="logo-circle">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <h1>Akıllı Kütüphane</h1>
                    <p>Hesabınıza giriş yapın</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="tcNoInput" class="sr-only">TC Kimlik No</label>
                        <div class="input-icon-wrapper">
                            <i class="fas fa-id-card input-icon" aria-hidden="true"></i>
                            <input type="text" id="tcNoInput" placeholder="11 haneli TC Kimlik No" maxlength="11" aria-required="true" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="passwordInput" class="sr-only">Şifre</label>
                        <div class="input-icon-wrapper">
                            <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                            <input type="password" id="passwordInput" placeholder="Şifreniz" aria-required="true" required>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Beni Hatırla</span>
                        </label>
                        <a href="#" class="forgot-pwd">Şifremi Unuttum</a>
                    </div>
                    <div id="loginError" class="login-error"></div>
                    <button type="submit" class="btn login-btn">
                        <span>Giriş Yap</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                <div class="login-footer">
                    &copy; 2026 Akıllı Kütüphane Sistemi
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Auth } from './js/auth.js';

        let failedAttempts = 0;
        let lockTime = 0;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tcNo = document.getElementById('tcNoInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.querySelector('.login-btn');
            
            if (Date.now() < lockTime) {
                const waitSecs = Math.ceil((lockTime - Date.now()) / 1000);
                errorDiv.style.display = 'block';
                errorDiv.textContent = `Çok fazla hatalı giriş yaptınız. Lütfen ${waitSecs} saniye bekleyin.`;
                return;
            }

            btn.textContent = 'Giriş Yapılıyor...';
            btn.disabled = true;

            const res = await Auth.login(tcNo, password);
            if(res.success) {
                failedAttempts = 0;
                window.location.href = 'index.html';
            } else {
                failedAttempts++;
                if (failedAttempts >= 3) {
                    lockTime = Date.now() + 30000; // 30 saniye kilit
                    failedAttempts = 0; // kilitten sonra tekrar 3 hak
                }
                errorDiv.style.display = 'block';
                errorDiv.textContent = res.message;
                btn.innerHTML = '<span>Giriş Yap</span><i class="fas fa-arrow-right"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
