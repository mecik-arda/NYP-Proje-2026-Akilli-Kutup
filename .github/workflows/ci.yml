# ==========================================================================
# Akilli Kutuphane V4.1 — CI (Continuous Integration) Workflow
#
# Adımlar:
#   1. Checkstyle (kod stili denetimi)
#   2. Maven compile
#   3. Unit + Integration testleri + JaCoCo coverage raporu
#   4. Test sonuçlarını ve coverage raporunu yayınlama
# ==========================================================================

name: CI — Build, Test & Coverage

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  build-and-test:
    name: Build, Checkstyle, Test & Coverage (Java 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: akilli_kutup
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify tool versions
        run: |
          java -version
          mvn --version

      # ── 1. Checkstyle Kod Stili Denetimi ────────────────────────
      - name: Checkstyle — Kod Stili Denetimi
        run: mvn checkstyle:check -B
        continue-on-error: false

      # ── 2. Derleme ──────────────────────────────────────────────
      - name: Compile
        run: mvn clean compile -B -q

      # ── 3. Test + JaCoCo Coverage ───────────────────────────────
      - name: Run Tests with JaCoCo Coverage
        run: mvn test -B
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: akilli_kutup
          PG_USER: postgres
          PG_PASS: postgres

      # ── 4. JaCoCo Coverage Raporu ───────────────────────────────
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/jacoco-report/
          retention-days: 14

      # ── 5. Test Sonuçları ───────────────────────────────────────
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      # ── 6. Test Raporu Yayınlama ────────────────────────────────
      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      # ── 7. JaCoCo Coverage Ozeti ─────────────────────────────────
      - name: JaCoCo Coverage Summary
        if: always()
        run: |
          if [ -f target/jacoco-report/jacoco.xml ]; then
            echo "📊 JaCoCo Coverage Report:"
            grep -oP 'counter type="INSTRUCTION" missed="\K[0-9]+' target/jacoco-report/jacoco.xml | head -1 > /tmp/missed.txt
            grep -oP 'counter type="INSTRUCTION" covered="\K[0-9]+' target/jacoco-report/jacoco.xml | head -1 > /tmp/covered.txt
            MISSED=$(cat /tmp/missed.txt 2>/dev/null || echo 0)
            COVERED=$(cat /tmp/covered.txt 2>/dev/null || echo 0)
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
              echo "   Covered: $COVERED / $TOTAL = $PCT%"
            fi
            echo "   Full report: target/jacoco-report/index.html"
          else
            echo "   Jacoco report not found (tests may have been skipped)"
          fi
