# ==========================================================================
# Akilli Kutuphane V4 — CI (Continuous Integration) Workflow
#
# Her push ve PR'da otomatik olarak çalışır:
#   1. Java 17 ile derleme
#   2. Tüm unit testleri çalıştırma (mvn clean test)
#   3. Test sonuçlarını raporlama
# ==========================================================================

name: CI - Build & Test

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manuel tetikleme

jobs:

  build-and-test:
    name: Build & Test (Java 17, Ubuntu)
    runs-on: ubuntu-latest

    services:
      # PostgreSQL servisi (entegrasyon testleri için)
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: akilli_kutup
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis servisi (rate limiting testleri için)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven and Java versions
        run: |
          java -version
          mvn --version

      - name: Build with Maven (compile only)
        run: mvn clean compile -B -q

      - name: Run all tests
        run: mvn test -B
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: akilli_kutup
          PG_USER: postgres
          PG_PASS: postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
